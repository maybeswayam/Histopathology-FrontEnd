name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight deps for tests
        run: |
          pip install fastapi==0.104.1 python-multipart==0.0.6 "python-jose[cryptography]==3.3.0" Pillow==10.1.0 pytest==7.4.3 pytest-asyncio==0.21.1
      - name: Run upload + auth unit tests
        run: |
          pytest -q tests/test_upload_validation.py tests/test_auth_settings.py
        env:
          AUTH_DISABLED: "true"
          CORS_ORIGINS: http://localhost:3000
          PYTHONPATH: .
